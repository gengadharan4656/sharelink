<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="linkGrad" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Hex/Shield -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="#111618" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.3" />
  <!-- Node A -->
  <circle cx="16" cy="16" r="6" fill="#10B981" filter="url(#glow)" />
  <circle cx="16" cy="16" r="3" fill="#FFFFFF" />
  <!-- Node B -->
  <circle cx="32" cy="32" r="6" fill="#10B981" filter="url(#glow)" />
  <circle cx="32" cy="32" r="3" fill="#FFFFFF" />
  <!-- Dynamic Transfer Path -->
  <path d="M 19 19 L 29 29" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
  <path d="M 28 14 C 36 14 38 22 34 26" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3" />
  <path d="M 20 34 C 12 34 10 26 14 22" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3" />
</svg>
